<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechPulse Electronics | Home & Store</title>

  <!-- Required Meta & SEO Tags -->
  <meta name="description" content="Explore high-quality smartphones, laptops, and tech accessories at TechPulse Electronics. Discover modern gadgets today.">
  <meta name="author" content="Agoro Kelechi David">

  <!-- Open Graph Social Sharing Tags -->
  <meta property="og:title" content="TechPulse Electronics - Modern Gadgets Hub">
  <meta property="og:type" content="website">
  <meta property="og:description" content="Find modern gadgets, compare specs, and purchase genuine electronics at TechPulse.">
  <meta property="og:image" content="https://mekaycee-tech.github.io/wdd231/final/images/logo.svg">
  <meta property="og:url" content="https://mekaycee-tech.github.io/wdd231/final/index.html">

  <!-- Favicon Link -->
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">

  <!-- Google Fonts API Preconnect and Link Tags -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">

  <!-- External Local CSS Stylesheets (2 required by audit) -->
  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="styles/responsive.css">

  <!-- External JavaScript Module in Head -->
  <script type="module" src="scripts/products.js"></script>
</head>
<body>

  <header>
    <div class="brand">
      <img src="images/logo.svg" alt="TechPulse Electronics Logo" width="200" height="60" class="site-logo">
    </div>
    <button class="hamburger" id="hamburger-btn" aria-label="Toggle navigation menu">☰</button>
    <nav>
      <ul id="nav-menu">
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="cart.html">Cart (<span id="cart-count">0</span>)</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>TechPulse Electronics Store</h1>
      <p>Discover the latest laptops, smartphones (Infinix, TECNO, Pixel, iPhone, Samsung), and accessories.</p>
    </section>

    <div class="controls">
      <input type="text" id="search-input" placeholder="Search gadgets, brands...">
      <select id="category-filter">
        <option value="All">All Categories</option>
        <option value="Apple">Apple</option>
        <option value="Android">Android (Infinix, TECNO, Pixel, Samsung)</option>
        <option value="Windows">Windows / Laptops</option>
        <option value="Accessories">Accessories</option>
      </select>
    </div>

    <section class="product-catalog">
      <h2>Product Catalog</h2>
      <div class="product-grid" id="product-container">
        <!-- Dynamic Products loaded via JavaScript -->
      </div>
    </section>

    <dialog id="product-modal">
      <h2 id="modal-title">Product Details</h2>
      <p id="modal-category" class="category-tag"></p>
      <p id="modal-description" class="modal-desc"></p>
      <p id="modal-price" class="price"></p>
      <button class="btn" id="close-modal-btn">Close</button>
    </dialog>
  </main>

  <footer>
    <p>&copy; 2026 Mekaycee-Tech | Agoro Kelechi David</p>
    <p><a href="attributions.html">Attributions & Sources</a></p>
  </footer>

</body>
</html>
