<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Background Gradient -->
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d14"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>

    <!-- Outer Tech Ring Gradient -->
    <linearGradient id="fav-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="50%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#03045e"/>
    </linearGradient>

    <!-- Vibrant Pulse Line Gradient -->
    <linearGradient id="fav-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#90e0ef"/>
      <stop offset="50%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#7209b7"/>
    </linearGradient>

    <!-- Node Glow Gradient -->
    <linearGradient id="fav-node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48cae4"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>

    <!-- Soft Glow Filter for High Visibility at Small Scale -->
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Favicon Container (Rounded Square for App/Tab Icon Feel) -->
  <rect width="512" height="512" rx="110" fill="url(#fav-bg)"/>

  <!-- Icon Center Group -->
  <g transform="translate(256, 256)">
    <!-- Outer Segmented Tech Ring -->
    <circle r="190" fill="none" stroke="url(#fav-ring)" stroke-width="16" opacity="0.4"/>
    <circle r="190" fill="none" stroke="#00b4d8" stroke-width="18" stroke-dasharray="90 40 160 50" filter="url(#fav-glow)"/>
    <circle r="215" fill="none" stroke="#90e0ef" stroke-width="6" stroke-dasharray="20 30 50 40" opacity="0.6"/>

    <!-- Circuit Connection Dots & Traces -->
    <line x1="-190" y1="0" x2="-140" y2="0" stroke="#00b4d8" stroke-width="6"/>
    <line x1="140" y1="0" x2="190" y2="0" stroke="#00b4d8" stroke-width="6"/>
    <circle cx="-140" cy="0" r="10" fill="url(#fav-node)"/>
    <circle cx="140" cy="0" r="10" fill="url(#fav-node)"/>

    <line x1="0" y1="-190" x2="0" y2="-140" stroke="#00b4d8" stroke-width="6"/>
    <line x1="0" y1="140" x2="0" y2="-190" stroke="#00b4d8" stroke-width="6"/>
    <circle cx="0" cy="-140" r="10" fill="url(#fav-node)"/>
    <circle cx="0" cy="140" r="10" fill="url(#fav-node)"/>

    <!-- Inner Core Shield -->
    <circle r="135" fill="#0d1b2a" stroke="#0077b6" stroke-width="6"/>

    <!-- Dynamic Heartbeat / Pulse Waveform -->
    <path d="M -110 0 L -60 0 L -38 -48 L -10 68 L 22 -82 L 52 42 L 72 -16 L 110 0" 
          fill="none" 
          stroke="url(#fav-pulse)" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#fav-glow)"/>

    <!-- Peak Nodes -->
    <circle cx="22" cy="-82" r="11" fill="#ffffff" filter="url(#fav-glow)"/>
    <circle cx="-10" cy="68" r="8" fill="#90e0ef"/>
  </g>
</svg>
