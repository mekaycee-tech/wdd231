<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechPulse Electronics | Contact Us</title>

  <meta name="description" content="Contact TechPulse support team for questions, device inquiries, or customer support.">
  <meta name="author" content="Agoro Kelechi David">

  <meta property="og:title" content="Contact TechPulse Electronics">
  <meta property="og:type" content="website">
  <meta property="og:description" content="Reach out to the TechPulse customer support team for prompt help with products and orders.">
  <meta property="og:image" content="https://mekaycee-tech.github.io/wdd231/final/images/logo.svg">
  <meta property="og:url" content="https://mekaycee-tech.github.io/wdd231/final/contact.html">

  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="styles/responsive.css">
</head>
<body>

  <header>
    <div class="brand">
      <img src="images/logo.svg" alt="TechPulse Electronics Logo" width="200" height="60" class="site-logo">
    </div>
    <button class="hamburger" id="hamburger-btn" aria-label="Toggle navigation menu">☰</button>
    <nav>
      <ul id="nav-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a href="contact.html" class="active">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Contact Customer Support</h1>
    <div class="form-container">
      <form action="thanks.html" method="get">
        <div class="form-group">
          <label for="fullname">Full Name:</label>
          <input type="text" id="fullname" name="fullname" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address:</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="subject">Inquiry Type:</label>
          <select id="subject" name="subject">
            <option value="General Support">General Support</option>
            <option value="Order Tracking">Order Tracking</option>
            <option value="Product Return">Product Return</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <button type="submit" class="btn">Submit Inquiry</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Mekaycee-Tech | Agoro Kelechi David</p>
    <p><a href="attributions.html">Attributions & Sources</a></p>
  </footer>

  <!-- Standard External JavaScript Link -->
  <script src="scripts/contact.js"></script>
</body>
</html>
